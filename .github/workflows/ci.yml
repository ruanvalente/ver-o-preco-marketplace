name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    # Mesmas variáveis configuradas no projeto Vercel, lidas de GitHub
    # Secrets. PRs de fork (e do Dependabot) não recebem secrets e caem nos
    # placeholders abaixo — os serviços falham fechados (ServiceResult) e
    # os testes usam mocks, então o build continua determinístico.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets['NEXT_PUBLIC_SUPABASE_URL'] || 'https://placeholder.invalid' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'placeholder-key' }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://placeholder.invalid' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Supabase environment
        run: |
          if [ "$NEXT_PUBLIC_SUPABASE_URL" = "https://placeholder.invalid" ]; then
            echo "::warning::Secrets do Supabase ausentes; usando placeholders (esperado em PRs de fork)."
          else
            echo "Supabase env carregado a partir dos secrets do repositório."
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
